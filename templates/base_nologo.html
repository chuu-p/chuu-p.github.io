<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>MyBlog</title>
    <link rel="stylesheet" href="{{ get_url(path='style.css', trailing_slash=false) | safe }}" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Noto+Emoji|Space+Mono|Space+Grotesk|VT323">
</head>


<body theme="{{ config.extra.theme }}">
    <header>
        {% block logo %} {% endblock %}
    </header>
    <section class="section">
        <div class="container">
            {% block content %} {% endblock %}
        </div>
    </section>
    <footer class="container" style="display: flex; align-items: center;">
        <a href="https://github.com/chuu-p">
            <img style="filter: invert(0);" src="{{ get_url(path='icon/github.svg', trailing_slash=false) | safe }}" />
        </a>
        <a href="https://mastodon.social/@chuu_p">
            <img style="filter: invert(0);"
                src="{{ get_url(path='icon/mastodon.svg', trailing_slash=false) | safe }}" />
        </a>
        <a href="mailto:j@chuu.dev">
            <img style="filter: invert(0);" src="{{ get_url(path='icon/email.svg', trailing_slash=false) | safe }}" />
        </a>
    </footer>
</body>

</html>
